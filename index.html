<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SIGLAR Materials — Coming Soon</title>
<meta name="description" content="SIGLAR Materials — High Purity Silicon Dioxide (SiO₂) from Rice Husk Ash — Coming Soon" />

<style>
  :root{
    --bg:#070815;
    --card:#ffffff;
    --muted:#b3b7c1;
    --accent:#00d4ff;
    --glass: rgba(255,255,255,0.06);
  }

  html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:var(--bg); color:#e9eef6; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}

  /* STARFIELD */
  .stars{
    position:fixed;inset:0;overflow:hidden;z-index:0;
    background:
      radial-gradient(1px 1px at 10% 20%, #fff 10%, transparent 12%),
      radial-gradient(1px 1px at 30% 40%, #fff 8%, transparent 12%),
      radial-gradient(1px 1px at 70% 10%, #fff 8%, transparent 12%),
      radial-gradient(1px 1px at 90% 60%, #fff 8%, transparent 12%),
      radial-gradient(1px 1px at 50% 80%, #fff 7%, transparent 12%);
    background-size: 100% 100%;
    animation: twinkle 6s linear infinite;
    filter: drop-shadow(0 0 6px rgba(0,160,255,0.02));
  }
  @keyframes twinkle {
    0%{opacity:.9}
    50%{opacity:1}
    100%{opacity:.9}
  }

  /* subtle moving large stars */
  .star-layer{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(3px 3px at 20% 30%, rgba(255,255,255,0.14) 0%, transparent 40%),
      radial-gradient(2px 2px at 80% 70%, rgba(255,255,255,0.12) 0%, transparent 40%),
      radial-gradient(2px 2px at 40% 15%, rgba(255,255,255,0.10) 0%, transparent 40%);
    opacity:0.9;
    animation: drift 40s linear infinite;
  }
  @keyframes drift { from{transform:translateY(0)} to{transform:translateY(-80px)} }

  /* CENTER CARD */
  .center {
    position:relative;
    z-index:5;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
    box-sizing:border-box;
  }
  .card {
    width:100%;
    max-width:820px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border-radius:14px;
    padding:34px;
    box-shadow: 0 10px 40px rgba(3,10,30,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.04);
    text-align:center;
  }

  h1{margin:0;font-size:30px;letter-spacing:-0.2px;color:#fff}
  p.lead{margin:10px 0 18px;color:var(--muted);font-size:17px;line-height:1.45}
  a.contact{display:inline-block;margin-top:8px;color:var(--accent);text-decoration:none;font-weight:600;padding:8px 16px;border-radius:8px;background:linear-gradient(90deg, rgba(11,108,255,0.07), rgba(0,212,255,0.03));border:1px solid rgba(11,108,255,0.08)}

  .meta{margin-top:14px;color:rgba(255,255,255,0.65);font-size:13px}

  /* SOLAR SYSTEM WRAPPER */
  .universe{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .system{
    width:900px;
    max-width:1200px;
    height:900px;
    max-height:1200px;
    transform: scale(0.6);
    opacity:.95;
  }

  /* Outer orbit container: center placed */
  .orbit-center{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:700px;height:700px;border-radius:50%;
    display:block;pointer-events:none;
  }

  /* Sun */
  .sun{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:24px;height:24px;border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #fff 0%, #ffd56b 12%, #ff9b21 40%, #ff6b00 70%, #ff3a00 100%);
    box-shadow: 0 0 40px rgba(255,140,50,0.22), 0 0 100px rgba(255,160,0,0.06);
    z-index:6;
  }

  /* generic orbit ring - faint glow */
  .orbit-ring{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    border-radius:50%;
    border: 1px dashed rgba(255,255,255,0.03);
    box-shadow: inset 0 0 28px rgba(11,108,255,0.01);
  }

  /* planet base */
  .planet{
    position:absolute;
    left:50%;top:50%;
    transform-origin: -50% -50%;
    translate: 0 0;
  }

  /* visual planet element */
  .planet .body{
    width:18px;height:18px;border-radius:50%;
    box-shadow: 0 6px 18px rgba(0,0,0,0.5), 0 0 8px rgba(0,0,0,0.15) inset;
    position:relative;
  }

  /* Each planet orbit size + animation timing */
  /* planet A (inner) */
  .orbit-a{ width:120px;height:120px; }
  .orbit-a .planet{ animation:spinA 8s linear infinite; }
  .orbit-a .planet .body{ background: linear-gradient(180deg,#9be7ff,#6ac8ff); width:12px;height:12px; box-shadow: 0 6px 12px rgba(0,0,0,0.45) }
  @keyframes spinA{ from{ transform: rotate(0deg) translateX(60px) } to { transform: rotate(360deg) translateX(60px) } }

  /* planet B */
  .orbit-b{ width:190px;height:190px; }
  .orbit-b .planet{ animation:spinB 12s linear infinite; }
  .orbit-b .planet .body{ background: linear-gradient(180deg,#ffd6f2,#ff9ed9); width:14px;height:14px; }
  @keyframes spinB{ from{ transform: rotate(0deg) translateX(95px) } to { transform: rotate(360deg) translateX(95px) } }

  /* planet C */
  .orbit-c{ width:280px;height:280px; }
  .orbit-c .planet{ animation:spinC 18s linear infinite; }
  .orbit-c .planet .body{ background: linear-gradient(180deg,#ffe9a5,#ffcf6b); width:18px;height:18px; }
  @keyframes spinC{ from{ transform: rotate(0deg) translateX(140px) } to { transform: rotate(360deg) translateX(140px) } }

  /* planet D */
  .orbit-d{ width:390px;height:390px; }
  .orbit-d .planet{ animation:spinD 28s linear infinite; }
  .orbit-d .planet .body{ background: linear-gradient(180deg,#d3e0ff,#9db7ff); width:22px;height:22px; }
  @keyframes spinD{ from{ transform: rotate(0deg) translateX(195px) } to { transform: rotate(360deg) translateX(195px) } }

  /* faint comet arc */
  .orbit-ring.small{ border-style:solid; opacity:0.06; filter:blur(.6px) }

  /* spaceship style (SVG) */
  .ship{
    position:absolute;left:50%;top:50%;transform-origin: -50% -50%; z-index:7;
    width:44px;height:28px;
    filter: drop-shadow(0 8px 18px rgba(0,20,60,0.55));
  }

  /* spaceship motions (two ships with different orbits & speeds) */
  .ship.one{ animation: shipA 11s linear infinite; transform: rotate(0deg) translateX(160px) rotate(30deg); }
  .ship.two{ animation: shipB 19s linear infinite; transform: rotate(0deg) translateX(240px) rotate(-10deg); opacity:0.95; }

  @keyframes shipA{
    0% { transform: rotate(0deg) translateX(160px) rotate(30deg) }
    50% { transform: rotate(180deg) translateX(160px) rotate(-90deg) }
    100% { transform: rotate(360deg) translateX(160px) rotate(30deg) }
  }
  @keyframes shipB{
    0% { transform: rotate(0deg) translateX(240px) rotate(-10deg) }
    50% { transform: rotate(180deg) translateX(240px) rotate(160deg) }
    100% { transform: rotate(360deg) translateX(240px) rotate(-10deg) }
  }

  /* subtle parallax scaling on hover (desktop) */
  @media (hover:hover){
    .card:hover{ transform: translateY(-6px); transition: transform .3s ease; }
    .ship:hover{ transform:scale(1.05) }
  }

  /* Responsive */
  @media (max-width:820px){
    .system{ transform: scale(0.48) translateY(-40px) }
    .card{ padding:26px; border-radius:12px }
    h1{font-size:24px}
  }
  @media (max-width:420px){
    .system{ transform: scale(0.38) translateY(-40px) }
    .card{ padding:22px }
    p.lead{ font-size:15px }
  }

  /* accessibility: reduce motion preference */
  @media (prefers-reduced-motion:reduce){
    .planet, .ship, .star-layer, .stars, .universe, .orbit-ring { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="stars" aria-hidden="true"></div>
<div class="star-layer" aria-hidden="true"></div>

<!-- Animated universe (solar system + ships) -->
<div class="universe" aria-hidden="true">
  <div class="system" role="img" aria-label="Animated solar system background">
    <div class="orbit-center" aria-hidden="true">
      <div class="sun" aria-hidden="true"></div>

      <!-- orbit rings -->
      <div class="orbit-ring orbit-a" style="width:120px;height:120px;margin-left:-60px;margin-top:-60px;"></div>
      <div class="orbit-ring orbit-b" style="width:190px;height:190px;margin-left:-95px;margin-top:-95px;"></div>
      <div class="orbit-ring orbit-c" style="width:280px;height:280px;margin-left:-140px;margin-top:-140px;"></div>
      <div class="orbit-ring orbit-d small" style="width:390px;height:390px;margin-left:-195px;margin-top:-195px;"></div>

      <!-- planets -->
      <div class="orbit-a">
        <div class="planet"><div class="body"></div></div>
      </div>

      <div class="orbit-b">
        <div class="planet"><div class="body"></div></div>
      </div>

      <div class="orbit-c">
        <div class="planet"><div class="body"></div></div>
      </div>

      <div class="orbit-d">
        <div class="planet"><div class="body"></div></div>
      </div>

      <!-- Spaceship SVGs -->
      <div class="ship one" title="Exploration craft">
        <svg viewBox="0 0 64 40" width="44" height="28" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
          <g fill="none" fill-rule="evenodd">
            <path d="M6 28c6-6 10-10 32-10s26 4 26 4-6 6-12 8S34 36 18 36c-8 0-12-2-12-8z" fill="#0b6cff" opacity="0.12"/>
            <path d="M2 22c6-8 18-12 34-12s34 8 26 24c-10 18-46 6-58 2-2-1-4-4-2-14z" fill="#eef8ff" opacity="0.06"/>
            <g transform="translate(6 4)">
              <ellipse cx="24" cy="16" rx="18" ry="8" fill="#072047" />
              <path d="M6 18c2-2 10-8 26-8s26 4 26 4-6 6-12 8c-8 2-24 6-40 6-8 0-8-8-6-10z" fill="#00d4ff" opacity="0.12"/>
              <path d="M8 10c3-4 18-10 40-2-6 2-18 6-36 6-6 0-8-2-4-4z" fill="#68f0ff" opacity="0.05"/>
              <path d="M12 8c0 0 6-6 22-4 14 1 18 6 18 6s-6 2-20 2S14 12 12 8z" fill="#9be7ff" opacity="0.08"/>
            </g>
          </g>
        </svg>
      </div>

      <div class="ship two" title="Surveyor">
        <svg viewBox="0 0 64 40" width="44" height="28" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
          <g fill="none" fill-rule="evenodd">
            <path d="M4 20c8-10 22-14 36-12 12 2 20 10 12 18-10 10-44 4-48-6z" fill="#fff" opacity="0.06"/>
            <g transform="translate(8 6)">
              <path d="M8 8c6-6 26-8 34 0 2 2 2 6-6 8-10 4-30 4-38 0-2-1-2-6 10-8z" fill="#ffd7a3" />
              <circle cx="12" cy="12" r="2" fill="#ffb36b" />
            </g>
          </g>
        </svg>
      </div>

    </div>
  </div>
</div>

<!-- CENTER CONTENT -->
<main class="center" role="main">
  <section class="card" role="region" aria-labelledby="title">
    <h1 id="title">SIGLAR Materials</h1>
    <p class="lead">High-Purity Silica (SiO₂) from Rice Husk Ash — Coming Soon</p>

    <a class="contact" href="mailto:info@siglar.in">Contact: info@siglar.in</a>

    <div class="meta" aria-hidden="true">Puducherry, India • Building green, sustainable materials</div>
  </section>
</main>

</body>
</html>
