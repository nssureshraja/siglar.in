<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SIGLAR Materials — Coming Soon</title>
<meta name="description" content="SIGLAR Materials — High Purity Silicon Dioxide (SiO₂) from Rice Husk Ash — Coming Soon" />
<style>
  :root{
    --bg:#020218;
    --card-bg: rgba(255,255,255,0.03);
    --muted:#b3b7c1;
    --accent:#00d4ff;
  }

  html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;background:var(--bg);color:#eaf0fb;overflow:hidden}
  /* canvas covers entire background */
  canvas#stars{ position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block; }

  /* universe container for planets + ships */
  .universe{
    position:fixed;inset:0;z-index:1;pointer-events:none;display:flex;align-items:center;justify-content:center;
  }

  /* center card remains readable */
  .center { position:relative; z-index:6; display:flex; align-items:center; justify-content:center; width:100%; height:100%; }
  .card {
    width: min(880px, 92%);
    padding: 28px;
    border-radius: 14px;
    text-align:center;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.04);
    box-shadow: 0 10px 40px rgba(3,10,30,0.6);
  }
  h1{margin:0;font-size:34px;color:#fff}
  p.lead{margin:10px 0 16px;color:var(--muted);font-size:17px}
  a.contact{display:inline-block;margin-top:8px;color:var(--accent);text-decoration:none;font-weight:600;padding:8px 16px;border-radius:8px;background:linear-gradient(90deg, rgba(11,108,255,0.06), rgba(0,212,255,0.03));border:1px solid rgba(11,108,255,0.06)}

  .meta{margin-top:12px;color:rgba(255,255,255,0.7);font-size:13px}

  /* Full-screen solar system (centered) */
  .system {
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width: min(1100px, 140vmin);
    height: min(1100px, 140vmin);
    pointer-events:none;
    z-index:2;
  }

  .orbit {
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    pointer-events:none;
    mix-blend-mode:screen;
  }

  /* orbits look faint */
  .orbit.ring { border: 1px solid rgba(255,255,255,0.03); box-shadow: 0 0 30px rgba(0,140,255,0.02) inset; }

  /* sun in center */
  .sun {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width: calc(var(--min,600px) * 0.035); height: calc(var(--min,600px) * 0.035);
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #fff 0%, #ffd56b 12%, #ff9b21 40%, #ff6b00 70%, #ff3a00 100%);
    box-shadow: 0 0 60px rgba(255,140,50,0.18), 0 0 140px rgba(255,140,30,0.06);
    z-index:8;
  }

  /* planet base */
  .planet {
    position:absolute; left:50%; top:50%;
    translate: 0 0;
    transform-origin: -50% -50%;
    will-change: transform;
  }
  .planet .body{
    border-radius:50%;
    box-shadow: 0 6px 18px rgba(0,0,0,0.55), inset 0 2px 6px rgba(255,255,255,0.03);
  }

  /* assign sizes via style attributes computed in JS (keeps responsive) */

  /* ship (SVG wrapper) */
  .ship {
    position:absolute; left:50%; top:50%; transform-origin: -50% -50%; z-index:9; will-change:transform;
    width:48px; height:32px; filter: drop-shadow(0 10px 20px rgba(0,20,60,0.6));
  }

  /* small subtle parallax on hover for desktop */
  @media (hover:hover){
    .card:hover{ transform: translateY(-6px); transition: transform .3s ease; }
  }

  /* responsive tweaks */
  @media (max-width:920px){
    h1{font-size:26px}
    .card{padding:20px}
  }
  @media (max-width:420px){
    h1{font-size:20px}
    p.lead{font-size:15px}
    .system{ display:none } /* hide heavy animation on tiny screens for performance */
  }

  /* reduced motion */
  @media (prefers-reduced-motion:reduce){
    .system, .ship, .planet, canvas#stars{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<canvas id="stars" aria-hidden="true"></canvas>

<div class="universe" aria-hidden="true">
  <div class="system" id="system" role="img" aria-label="Animated solar system background">
    <!-- Orbits will be injected via JS for full-screen responsive sizing -->
    <div class="sun" id="sun" aria-hidden="true"></div>
    <!-- ships -->
    <div class="ship" id="ship1" title="Explorer">
      <!-- simple ship SVG -->
      <svg viewBox="0 0 64 40" width="48" height="32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="none" fill-rule="evenodd">
          <path d="M6 28c6-6 10-10 32-10s26 4 26 4-6 6-12 8S34 36 18 36c-8 0-12-2-12-8z" fill="#0b6cff" opacity="0.12"/>
          <g transform="translate(6 4)">
            <ellipse cx="24" cy="16" rx="18" ry="8" fill="#072047" />
            <path d="M6 18c2-2 10-8 26-8s26 4 26 4-6 6-12 8c-8 2-24 6-40 6-8 0-8-8-6-10z" fill="#00d4ff" opacity="0.14"/>
          </g>
        </g>
      </svg>
    </div>

    <div class="ship" id="ship2" title="Surveyor">
      <svg viewBox="0 0 64 40" width="48" height="32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="none" fill-rule="evenodd">
          <path d="M4 20c8-10 22-14 36-12 12 2 20 10 12 18-10 10-44 4-48-6z" fill="#fff" opacity="0.06"/>
          <g transform="translate(8 6)">
            <path d="M8 8c6-6 26-8 34 0 2 2 2 6-6 8-10 4-30 4-38 0-2-1-2-6 10-8z" fill="#ffd7a3" />
          </g>
        </g>
      </svg>
    </div>

    <!-- planets container (JS will create planet elements and orbits) -->
    <div id="planets-root" aria-hidden="true"></div>
  </div>
</div>

<!-- Center content -->
<main class="center" role="main" aria-labelledby="title">
  <section class="card" role="region" aria-labelledby="title">
    <h1 id="title">SIGLAR Materials</h1>
    <p class="lead">High-Purity Silica (SiO₂) from Rice Husk Ash — Coming Soon</p>
    <a class="contact" href="mailto:info@siglar.in">Contact: info@siglar.in</a>
    <div class="meta">Puducherry, India • Building green, sustainable materials</div>
  </section>
</main>

<script>
(function(){
  // Respect reduced motion
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- STARFIELD (canvas) ---------- */
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d', { alpha: true });
  let w = canvas.width = innerWidth;
  let h = canvas.height = innerHeight;
  const DPR = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = w * DPR; canvas.height = h * DPR; canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.scale(DPR, DPR);

  let stars = [];
  const STAR_COUNT = Math.floor((w*h) / 6000); // many stars; scales with screen
  for (let i=0;i<STAR_COUNT;i++){
    stars.push({
      x: Math.random()*w,
      y: Math.random()*h,
      r: Math.random()*1.6 + 0.2,
      alpha: Math.random()*0.9 + 0.1,
      twinkle: Math.random()*0.02 + 0.005,
      vx: (Math.random()-0.5)*0.02,
      vy: (Math.random()-0.5)*0.02
    });
  }
  function drawStars(time){
    ctx.clearRect(0,0,w,h);
    // subtle gradient background
    const grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,'#040418');
    grad.addColorStop(1,'#00030a');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);

    for (let s of stars){
      // twinkle
      s.alpha += (Math.sin(time*0.0005 + s.x*0.001)*0.003 + (Math.random()-0.5)*0.002) * s.twinkle;
      s.alpha = Math.max(0.05, Math.min(1, s.alpha));
      // drift very slowly for parallax
      s.x += s.vx* (1 + Math.sin(time*0.0002)*0.3);
      s.y += s.vy* (1 + Math.cos(time*0.0002)*0.3);
      if (s.x < 0) s.x = w;
      if (s.x > w) s.x = 0;
      if (s.y < 0) s.y = h;
      if (s.y > h) s.y = 0;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,' + s.alpha + ')';
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
  }

  /* ---------- SOLAR SYSTEM & PLANETS (DOM elements + JS animation) ---------- */
  const system = document.getElementById('system');
  const planetsRoot = document.getElementById('planets-root');
  const minDim = Math.min(window.innerWidth, window.innerHeight);
  system.style.setProperty('--min', minDim + 'px');

  // Planet definitions: radiusFraction = fraction of half system size (0..1)
  const planetDefs = [
    { name:'Mercury', color:['#9be7ff','#6ac8ff'], sizeRatio:0.018, orbitRadiusRatio:0.12, speed:0.9 },
    { name:'Venus', color:['#ffd6f2','#ff9ed9'], sizeRatio:0.030, orbitRadiusRatio:0.22, speed:0.65 },
    { name:'Earth', color:['#a5d8ff','#6db8ff'], sizeRatio:0.038, orbitRadiusRatio:0.34, speed:0.45 },
    { name:'Mars', color:['#ffd7a3','#ffb36b'], sizeRatio:0.028, orbitRadiusRatio:0.46, speed:0.32 },
    { name:'Jupiter', color:['#f6e0c0','#e6c17f'], sizeRatio:0.065, orbitRadiusRatio:0.62, speed:0.18 },
  ];

  // create orbit and planet elements
  const orbits = [];
  for (let i=0;i<planetDefs.length;i++){
    const def = planetDefs[i];
    const orbit = document.createElement('div');
    orbit.className = 'orbit ring';
    planetsRoot.appendChild(orbit);
    const planet = document.createElement('div');
    planet.className = 'planet';
    const body = document.createElement('div');
    body.className = 'body';
    // styling will be applied in resize handler
    planet.appendChild(body);
    orbit.appendChild(planet);
    orbits.push({ orbit, planet, body, def, angle: Math.random()*Math.PI*2, drift: (Math.random()-0.5)*0.002 });
  }

  // resize handler to set sizes responsive
  function resizeSystem(){
    const sysRect = system.getBoundingClientRect();
    const R = Math.min(sysRect.width, sysRect.height) / 2;
    system.style.setProperty('--min', Math.min(window.innerWidth, window.innerHeight) + 'px');
    orbits.forEach((o, idx)=>{
      const orbitRadius = R * o.def.orbitRadiusRatio;
      const orbitSize = orbitRadius * 2;
      o.orbit.style.width = orbitSize + 'px';
      o.orbit.style.height = orbitSize + 'px';
      o.orbit.style.marginLeft = (-orbitRadius) + 'px';
      o.orbit.style.marginTop = (-orbitRadius) + 'px';
      // planet size
      const bodySize = Math.max(6, R * o.def.sizeRatio);
      o.body.style.width = bodySize + 'px';
      o.body.style.height = bodySize + 'px';
      // color gradient
      o.body.style.background = `linear-gradient(180deg, ${o.def.color[0]}, ${o.def.color[1]})`;
      // initial position
      const x = Math.cos(o.angle) * orbitRadius;
      const y = Math.sin(o.angle) * orbitRadius;
      o.planet.style.transform = `translate(${x}px, ${y}px)`;
    });
  }

  /* ---------- SHIP ANIMATION (random radial in/out, speed changes) ---------- */
  const shipEls = [
    { el: document.getElementById('ship1'), baseOrbit: 0.36, speed: 0.018, dir: 1 },
    { el: document.getElementById('ship2'), baseOrbit: 0.58, speed: 0.01, dir: -1 },
  ];
  // per-ship dynamic state
  shipEls.forEach(s=>{
    s.theta = Math.random()*Math.PI*2;
    s.radius = s.baseOrbit; // fraction of R
    s.vtheta = s.speed * (0.6 + Math.random()*0.8) * (Math.random()>0.5 ? 1 : -1);
    s.radialDir = (Math.random()>0.5?1:-1);
    s.radialSpeed = 0.001 + Math.random()*0.004;
    s.lastChange = performance.now();
  });

  /* ---------- Animation loop ---------- */
  let then = performance.now();
  function animate(now){
    const dt = now - then;
    then = now;
    if (!reduceMotion){
      // stars
      drawStars(now);
      // planets: update angles and position
      orbits.forEach(o=>{
        // angle speed proportional to def.speed, tiny drift
        o.angle += (o.def.speed * 0.0007 + o.drift) * dt;
        // compute orbit radius from current orbit element (already set)
        const orbitRect = o.orbit.getBoundingClientRect();
        const R = orbitRect.width / 2;
        const x = Math.cos(o.angle) * R;
        const y = Math.sin(o.angle) * R;
        o.planet.style.transform = `translate(${x}px, ${y}px)`;
      });

      // ships dynamic
      const sysRect = system.getBoundingClientRect();
      const Rsys = Math.min(sysRect.width, sysRect.height) / 2;
      shipEls.forEach(s=>{
        // slight random speed variation
        if (Math.random() < 0.002) s.vtheta *= (0.7 + Math.random()*0.6);
        // occasional radial in/out burst
        if (Math.random() < 0.005 && (now - s.lastChange) > 1000){
          s.radialDir *= -1;
          s.lastChange = now;
        }
        // apply radial oscillation
        s.radius += s.radialDir * s.radialSpeed * (dt/16);
        // clamp radius
        s.radius = Math.max(0.18, Math.min(0.85, s.radius));
        // theta advance
        s.theta += s.vtheta * dt * (1 + Math.sin(now*0.001 + s.theta)*0.2);
        // convert to px
        const orbitPx = Rsys * s.radius;
        const x = Math.cos(s.theta) * orbitPx;
        const y = Math.sin(s.theta) * orbitPx;
        // rotation for visual orientation
        const rot = (s.theta * 180/Math.PI) + (s.dir > 0 ? 30 : -10);
        s.el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
      });
    } else {
      // still draw stars static once if reduced motion
      drawStars(now);
    }
    requestAnimationFrame(animate);
  }

  /* ---------- Initialization and listeners ---------- */
  function init(){
    // initial draw and sizes
    w = canvas.width = innerWidth * DPR;
    h = canvas.height = innerHeight * DPR;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);

    // (re)compute stars if viewport changed big
    if (stars.length < 100 || stars.length > ((innerWidth*innerHeight)/2000)){
      stars = [];
      const STAR_COUNT2 = Math.floor((innerWidth*innerHeight) / 6000);
      for (let i=0;i<STAR_COUNT2;i++){
        stars.push({
          x: Math.random()*innerWidth,
          y: Math.random()*innerHeight,
          r: Math.random()*1.6 + 0.2,
          alpha: Math.random()*0.9 + 0.1,
          twinkle: Math.random()*0.02 + 0.005,
          vx: (Math.random()-0.5)*0.02,
          vy: (Math.random()-0.5)*0.02
        });
      }
    }
    resizeSystem();
  }

  window.addEventListener('resize', ()=>{
    // debounce
    clearTimeout(window._resizeTO);
    window._resizeTO = setTimeout(()=>{
      w = canvas.width = innerWidth * DPR;
      h = canvas.height = innerHeight * DPR;
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
      ctx.setTransform(DPR,0,0,DPR,0,0);
      resizeSystem();
    }, 120);
  }, { passive:true });

  // initial run
  init();
  requestAnimationFrame(animate);

  // stop if user prefers reduced motion
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  mq.addEventListener && mq.addEventListener('change', ()=>{ location.reload(); });
})();
</script>
</body>
</html>
